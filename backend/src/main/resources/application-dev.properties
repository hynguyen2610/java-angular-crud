spring.datasource.url=jdbc:h2:mem:cruddb
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.flyway.enabled=false

management.endpoints.web.exposure.include=health,metrics,info,env,beans
management.endpoint.env.show-values=never

app.jwt.secret=${APP_JWT_SECRET:change-me-change-me-change-me-change-me-1234}
app.jwt.expiration-ms=3600000
app.webauthn.rp-id=${APP_WEBAUTHN_RP_ID:localhost}
app.webauthn.origins=${APP_WEBAUTHN_ORIGINS:http://localhost:4200}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.security.h2-console-enabled=true
app.security.actuator-details-enabled=true
