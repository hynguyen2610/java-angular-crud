spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
# Password comes from DB_PASSWORD, or from Secrets Manager when APP_DATASOURCE_PASSWORD_SECRET_ID
# (secret name or ARN; SecretString is the password) is set, which then takes precedence.
# APP_AWS_SECRETSMANAGER_ENDPOINT points the client at LocalStack; region and credentials come
# from the standard AWS_* variables.
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
spring.flyway.enabled=true

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=3600000
app.webauthn.rp-id=${APP_WEBAUTHN_RP_ID}
app.webauthn.origins=${APP_WEBAUTHN_ORIGINS}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.security.h2-console-enabled=false
app.bootstrap-admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD}
