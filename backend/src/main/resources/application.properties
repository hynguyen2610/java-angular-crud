spring.profiles.default=dev
spring.jpa.open-in-view=false
server.error.include-message=always
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Product images: 5 MiB per file; the image validator and the 413 message read this same value.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Tomcat drains up to this much of an oversized body so the client still receives the 413 response
# (rather than a connection reset); anything beyond is aborted.
server.tomcat.max-swallow-size=10MB

resilience4j.circuitbreaker.instances.productImageStorage.sliding-window-size=10
resilience4j.circuitbreaker.instances.productImageStorage.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.productImageStorage.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productImageStorage.wait-duration-in-open-state=30s
