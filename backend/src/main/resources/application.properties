spring.datasource.url=jdbc:h2:mem:cruddb
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# JWT (demo only: use an env variable / secret manager in real projects)
app.jwt.secret=change-me-change-me-change-me-change-me-1234
app.jwt.expiration-ms=3600000

# CORS: origins allowed to call the API directly (not needed when using the Angular dev proxy)
app.cors.allowed-origins=http://localhost:4200

server.error.include-message=always
