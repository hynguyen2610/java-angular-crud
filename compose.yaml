services:
  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      APP_JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET.}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:8080"
