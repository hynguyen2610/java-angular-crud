openapi: 3.1.0
info:
  title: Product Manager API
  version: 1.0.0
  description: Profile endpoints for the authenticated Product Manager user.
paths:
  /api/auth/me:
    get:
      operationId: getCurrentProfile
      summary: Read the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateCurrentProfile
      summary: Change the authenticated user's username
      description: A successful username change invalidates the caller's current bearer token. Sign in again using the new username.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile. The current bearer token is no longer valid after this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Invalid or malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Username is already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Missing, expired, invalid, or invalidated bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    Profile:
      type: object
      required: [username]
      properties:
        username:
          type: string
          maxLength: 100
    UpdateProfileRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
    ApiError:
      type: object
      required: [status, message, errors]
      properties:
        status:
          type: integer
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
